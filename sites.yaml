# Add career pages to track here, then commit.
# The next scheduled run picks them up automatically.
#
# Each site needs three fields:
#   name      - human-readable label (also the unique key in seen.json)
#   url       - the page to scrape
#   selector  - CSS selector that matches each individual job link
#
# Optional:
#   base_url  - used to resolve relative href values; defaults to `url`
#
# How to find the selector:
#   1. Open the career page in your browser
#   2. Right-click a job title -> Inspect
#   3. In devtools, find a CSS class/attribute common to ALL job rows
#      (e.g. `.opening a`, `a.posting-title`, `a[href*='/jobs/']`)
#   4. Test it: paste `document.querySelectorAll('YOUR_SELECTOR').length` into
#      the browser console - it should match the number of jobs on the page.
#
# Heads-up about JS-rendered pages:
#   Many modern career pages load jobs with JavaScript after the initial HTML.
#   This scraper only sees the raw HTML. If your selector matches 0 jobs even
#   though the site clearly has openings, look for the underlying ATS link
#   (Greenhouse, Lever, Ashby, Workday, etc.) - those usually serve real HTML.

sites:
  - name: Ogilvy UK
    url: https://job-boards.greenhouse.io/ogilvyuk
    selector: "tr.job-post a"

  - name: Koto
    url: https://koto.com/careers
    selector: "a[href^='/careers/']"

  - name: Leo Burnett (global)
    url: https://careers.publicisgroupe.com/leoburnett/jobs
    selector: "a.job-title-link"
    render: js
    wait_selector: "a.job-title-link"

